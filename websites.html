</head>
<body>

    <header class="navbar">
        <a class="logo" href="index.html">Portofoliu</a>
        <nav id="nav-menu" aria-label="Navigare principală">
            <ul>

                <li><a href="index.html#portofoliu">Portofoliu</a></li>

        </nav>
        <button class="burger-menu" id="burger-btn" type="button" aria-label="Deschide meniul" aria-expanded="false" aria-controls="nav-menu">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </button>
    </header>

    <main>
        <section class="portfolio-page">
            <div class="page-head">
                <h1 class="page-title">Toate site-urile web</h1>
                <p class="lead">Două proiecte făcute de mine, fiecare cu link către versiunea live.</p>
            </div>

            <div class="portfolio-grid">
                <article class="portfolio-item">
                    <a class="frame" href="https://void-craft.vercel.app" target="_blank" rel="noopener" tabindex="-1" aria-hidden="true">
                        <div class="frame-bar">
                            <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
                            <span class="url">void-craft.vercel.app</span>
                        </div>
                        <img src="site1.png" alt="Captură de ecran a site-ului Site 1" loading="lazy">

                        <a href="https://void-craft.vercel.app" class="view-more" target="_blank" rel="noopener">Deschide site-ul</a>

    </footer>

    <script>
        (function () {
            var btn = document.getElementById('burger-btn');
            var menu = document.getElementById('nav-menu');
            function setOpen(open) {
                menu.classList.toggle('open', open);
                btn.classList.toggle('open', open);
                btn.setAttribute('aria-expanded', open ? 'true' : 'false');
                btn.setAttribute('aria-label', open ? 'Închide meniul' : 'Deschide meniul');
            }
            btn.addEventListener('click', function () { setOpen(!menu.classList.contains('open')); });
            menu.addEventListener('click', function (e) { if (e.target.tagName === 'A') setOpen(false); });
            document.addEventListener('keydown', function (e) { if (e.key === 'Escape') setOpen(false); });
        })();
    </script>
</body>
</html>
