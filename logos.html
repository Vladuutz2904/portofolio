    <dialog class="lightbox" id="lightbox" aria-label="Previzualizare logo">
        <button class="lightbox-close" id="lightbox-close" type="button">Închide</button>
        <img id="lightbox-img" src="" alt="">
    </dialog>

    <script>
        (function () {
            /* Meniu burger */
            var btn = document.getElementById('burger-btn');
            var menu = document.getElementById('nav-menu');
            function setOpen(open) {
                menu.classList.toggle('open', open);
                btn.classList.toggle('open', open);
                btn.setAttribute('aria-expanded', open ? 'true' : 'false');
                btn.setAttribute('aria-label', open ? 'Închide meniul' : 'Deschide meniul');
            }
            btn.addEventListener('click', function () { setOpen(!menu.classList.contains('open')); });
            menu.addEventListener('click', function (e) { if (e.target.tagName === 'A') setOpen(false); });
            document.addEventListener('keydown', function (e) { if (e.key === 'Escape') setOpen(false); });

            /* Logo mare */
            var dlg = document.getElementById('lightbox');
            var img = document.getElementById('lightbox-img');
            document.querySelectorAll('.logo-card').forEach(function (card) {
                card.addEventListener('click', function () {
                    if (!dlg.showModal) { window.open(card.dataset.src, '_blank'); return; }
                    img.src = card.dataset.src;
                    img.alt = card.dataset.title;
                    dlg.showModal();
                });
            });
            document.getElementById('lightbox-close').addEventListener('click', function () { dlg.close(); });
            dlg.addEventListener('click', function (e) { if (e.target === dlg) dlg.close(); });
        })();
    </script>
